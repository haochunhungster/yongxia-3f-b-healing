<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>詠夏雙人療癒房</title>
<style>
:root{--bg:#f6f2ec;--fg:#3b352e;--mut:#8a7f72;--card:#fff;--line:#d8cfc3}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--fg:#ece5da;--mut:#a39887;--card:#262320;--line:#3a352f}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
header{padding:28px 16px 8px;max-width:1400px;margin:auto}
h1{font-weight:500;margin:0 0 6px;font-size:24px}
header p{color:var(--mut);margin:0;line-height:1.6;font-size:14px}
nav{position:sticky;top:0;background:var(--bg);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;max-width:1400px;margin:auto;z-index:2;max-height:30vh;overflow-y:auto}
nav a{font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--card)}
section{max-width:1400px;margin:18px auto;padding:0 16px;scroll-margin-top:12px}
h2{font-weight:500;font-size:20px;display:flex;gap:10px;align-items:center}
h2 span{font-size:13px;background:var(--fg);color:var(--bg);border-radius:99px;padding:2px 9px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
figure{margin:0;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px #0001;cursor:zoom-in}
figure img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--line)}
figcaption{font-size:13px;color:var(--mut);padding:6px 10px}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:9;flex-direction:column;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:100vw;max-height:86vh;object-fit:contain}
#lb .cap{color:#eee;font-size:14px;padding:10px 16px;text-align:center}
#lb button{position:absolute;background:#0006;color:#fff;border:0;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb .x{top:12px;right:12px}#lb .p{left:8px;top:50%}#lb .n{right:8px;top:50%}
</style>
</head>
<body>
<header><h1>3F_B 雙人療癒房｜一百組風格</h1>
<p>詠夏 Villa 三樓西北側雙人房：包棟客人回房休息的療癒睡眠空間（180×200 大床、床頭牆包柱、窗邊長臥榻、無沙發茶几；北露台圓池 D1.80 m、池緣高出地面 45 cm）。11–20 組加入玻璃磚設計。底圖為 R14e 白模，AI 生成，每張圖都是獨立生成。AI 效果圖用來看質感，尺寸以模型為準。點圖看大圖，可以左右切換同一組的 15 個視角。</p></header>
<nav id="nav"></nav>
<section id="plan"><h2>平面尺寸圖</h2><a href="plan.jpg" target="_blank"><img src="plan.jpg" alt="平面尺寸圖" style="width:100%;max-width:1200px;display:block;border-radius:10px;background:#fff"></a><p style="color:var(--mut);font-size:13px">單位 cm，尺寸取自 Blender 模型；點圖開原尺寸。施工以設計師圖面與現場丈量為準。</p></section>
<div id="list"></div>
<div id="lb"><button class="x" aria-label="關閉">×</button><button class="p" aria-label="上一張">‹</button><img alt=""><div class="cap"></div><button class="n" aria-label="下一張">›</button></div>
<script src="data.js"></script>
<script>
const S=[['00','白模底圖']].concat(DATA.styles),V=DATA.views,pad=i=>String(i+1).padStart(2,'0');
const file=(n,i)=>n==='00'?`clay_v${pad(i)}.jpg`:`s${n}_v${pad(i)}.jpg`;
document.getElementById('nav').innerHTML='<a href="#plan">平面尺寸圖</a>'+S.map(([n,nm])=>`<a href="#s${n}">${n==='00'?'':n+' '}${nm}</a>`).join('');
document.getElementById('list').innerHTML=S.map(([n,nm])=>`<section id="s${n}"><h2>${n==='00'?'':`<span>${n}</span>`}${nm}</h2><div class="row">`+
  V.map((v,i)=>`<figure data-n="${n}" data-i="${i}"><img loading="lazy" src="thumb/${file(n,i)}" alt="${nm} ${v.slice(2)}"><figcaption>${v.slice(2)}</figcaption></figure>`).join('')+`</div></section>`).join('');
const lb=document.getElementById('lb'),img=lb.querySelector('img'),cap=lb.querySelector('.cap');let cn,ci;
function show(n,i){cn=n;ci=(i+V.length)%V.length;img.src='img/'+file(cn,ci);
  const nm=S.find(s=>s[0]===cn)[1];cap.textContent=`${cn==='00'?'':cn+' '}${nm}｜${V[ci].slice(2)}（${ci+1}/${V.length}）`;lb.classList.add('on')}
document.getElementById('list').onclick=e=>{const f=e.target.closest('figure');if(f)show(f.dataset.n,+f.dataset.i)};
const close=()=>lb.classList.remove('on');
lb.querySelector('.x').onclick=close;img.onclick=close;
lb.querySelector('.p').onclick=()=>show(cn,ci-1);lb.querySelector('.n').onclick=()=>show(cn,ci+1);
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='ArrowLeft')show(cn,ci-1);if(e.key==='ArrowRight')show(cn,ci+1);if(e.key==='Escape')close()});
let tx=null;lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(cn,ci+(d<0?1:-1));tx=null});
</script>
</body>
</html>
